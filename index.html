<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fhlm 的页面导航</title>
<style>
  :root {
    --bg: #f4f6f9;
    --card: #ffffff;
    --ink: #2c3e50;
    --sub: #7f8c9b;
    --accent: #3b82f6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 60px;
  }
  header { text-align: center; margin-bottom: 36px; }
  header h1 { font-size: 26px; font-weight: 700; letter-spacing: 1px; }
  header p { color: var(--sub); font-size: 14px; margin-top: 8px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
    width: 100%;
    max-width: 960px;
  }
  a.card {
    display: block;
    background: var(--card);
    border-radius: 14px;
    padding: 22px;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
    transition: transform .15s ease, box-shadow .15s ease;
    border: 1px solid #e8edf2;
  }
  a.card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 22px rgba(59,130,246,.15);
  }
  .card .icon { font-size: 34px; }
  .card h2 { font-size: 18px; margin: 12px 0 6px; }
  .card p { font-size: 13px; color: var(--sub); line-height: 1.6; }
  .card .tag {
    display: inline-block;
    margin-top: 14px;
    font-size: 12px;
    color: var(--accent);
    background: rgba(59,130,246,.1);
    border-radius: 20px;
    padding: 3px 12px;
  }
  footer { margin-top: auto; padding-top: 48px; color: var(--sub); font-size: 12px; }
</style>
</head>
<body>
  <header>
    <h1>fhlm 的页面导航</h1>
    <p>各类自托管小页面，点击卡片进入</p>
  </header>

  <div class="grid">
    <a class="card" href="aobuta/">
      <div class="icon">🎞️</div>
      <h2>青ブタ × 孤独摇滚 圣地巡礼</h2>
      <p>2026-11-22 湘南·江ノ島巡礼时间表：住吉出发，藤沢→七里ヶ浜→江ノ島→龟户→羽田，双作品 29+ 圣地打卡。</p>
      <span class="tag">2026-11-22</span>
    </a>
    <!-- 新页面卡片加在这行注释下面 -->
    <a class="card" href="kanazawa/">
      <div class="icon">🎤</div>
      <h2>金泽 · 莲之空 Link Live 行程</h2>
      <p>2026-11-28~29 双日行程表：成田红眼落地→新干线→石川県産業展示館，硬纪律 / 票务 / 风险对策 / 待办清单，手机随时查看。</p>
      <span class="tag">2026-11-28</span>
    </a>
  </div>

  <footer>© 2026 fhlm · powered by GitHub Pages</footer>
</body>
</html>
