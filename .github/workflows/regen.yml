name: Regenerate index.html from Excel

on:
  workflow_dispatch:
    inputs:
      xlsx_filename:
        description: "Excel 文件名（须与仓库根目录下文件名完全一致，含扩展名）"
        required: false
        default: "青ブタ圣地巡礼时间表_2026-11-22.xlsx"
  push:
    paths:
      - "*.xlsx"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install openpyxl
        run: pip install openpyxl

      - name: Run generator (force rebuild every run)
        run: |
          python force_regen.py

      - name: Verify index.html regenerated
        run: |
          test -s index.html
          echo "index.html size: $(wc -c < index.html)"

      - name: Commit regenerated index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "no changes" || git commit -m "chore: regenerate index.html from xlsx [skip ci]"
          git push
