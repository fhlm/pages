name: Regenerate index.html from Excel

on:
  workflow_dispatch:
    inputs:
      xlsx_filename:
        description: "Excel 文件名（须与 aobuta/ 下文件名完全一致，含扩展名；留空则自动识别）"
        required: false
        default: "青ブタ圣地巡礼时间表_2026-11-22.xlsx"
  push:
    paths:
      - "aobuta/*.xlsx"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install openpyxl
        run: pip install openpyxl

      - name: Run generator (force rebuild every run)
        working-directory: aobuta
        run: |
          python force_regen.py

      - name: Regenerated page lives at aobuta/index.html (hub layout keeps it there)
        run: |
          test -s aobuta/index.html
          echo "aobuta/index.html size: $(wc -c < aobuta/index.html)"

      - name: Commit regenerated page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aobuta/index.html
          git diff --cached --quiet && echo "no changes" || git commit -m "chore: regenerate aobuta page from xlsx [skip ci]"
          git push
