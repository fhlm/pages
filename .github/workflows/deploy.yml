on:
  workflow_dispatch:
  push:
    branches: [master, main]

permissions:
  contents: read
  pages: write
  id-token: write
  administration: write  # 首次部署时允许 configure-pages 自动创建 Pages 站点

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
